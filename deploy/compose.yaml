name: prayerwall-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prayerwall
      POSTGRES_USER: prayerwall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgsqldev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Force TCP: without -h this checks the unix socket, which the
      # entrypoint's temporary initdb server also listens on, so the check
      # can pass before the database is actually ready for clients.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U prayerwall -d prayerwall"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://prayerwall:${POSTGRES_PASSWORD:-pgsqldev}@postgres:5432/prayerwall?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
